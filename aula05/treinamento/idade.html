<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idade</title>
        <style>
        body {
            background-color: rgb(220, 174, 231);
            color: rgb(134, 63, 134);
            font-family: Georgia, 'Times New Roman', Times, serif;
            font: normal 20pt;
            text-align: center;
        }
        h1 {
            color: rgb(133, 25, 133);
        }
        input {
            font: normal 20pt Georgia;
            width: 150px;
        }
        #ver {
    transition: color 1s ease;
    font-weight: bold;
    font-size: 22pt;
}
    </style>
</head>
<body>
    <h1>Menor de idade, adulto ou idoso?</h1>
    <p>Digite sua idade e direi-lhe se você é menor de idade, adulto ou idoso 🐰</p>
    <input type="number" name="txtn1" id="txtn1">
    <input type="button" value="Verificar" onclick="ver()">
    <div id="ver"></div>
    <script>
        function ver(){
            var idade = Number(document.getElementById('txtn1').value)
            var resultado = document.getElementById('ver')
            if (document.getElementById('txtn1').value === "") {
                resultado.innerHTML = `Por favor, digite a idade 🌸`
                resultado.style.color = "red";
                return;
            }
            if (idade < 18) {
                resultado.innerHTML = `Menor de idade✨`
                resultado.style.color = "red";
            } else {
                if (idade < 60) {
                    resultado.innerHTML = `Adulto✨`
                    resultado.style.color = "green";
                } else {
                    resultado.innerHTML = `Idoso✨`
                    resultado.style.color = "blue";
                }
            }
        }
    </script>
</body>
</html>

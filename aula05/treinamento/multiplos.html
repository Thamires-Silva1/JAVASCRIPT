<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Múltiplos</title>
</head>
        <style>
        body {
            background-color: rgb(220, 174, 231);
            color: rgb(134, 63, 134);
            font-family: Georgia, 'Times New Roman', Times, serif;
            font: normal 20pt;
            text-align: center;
        }
        h1 {
            color: rgb(133, 25, 133);
        }
        input {
            font: normal 20pt Georgia;
            width: 150px;
        }
        #ver {
    transition: color 1s ease;
    font-weight: bold;
    font-size: 22pt;
}
    </style>
<body>
    <h1>Múltiplo de 3 ou 5</h1>
    <p>Digite um número e direi-lhe se ele é múltiplo de 3 ou 5 🐇</p>
    <input type="number" name="txtn1" id="txtn1">
    <input type="button" value="Verificar" onclick="ver()">
    <div id="ver"></div>
    <script>
        function ver() {
            var num = Number(document.getElementById('txtn1').value)
            var resultado = document.getElementById('ver')
            if (document.getElementById('txtn1').value === "") {
                resultado.innerHTML = `Por favor, insira um número ❤️`
                resultado.style.color = "red";
                return;
            }
            if (num % 15 === 0) {
                resultado.innerHTML = `O número <strong> ${num}</strong> é múltiplo de 3 e 5💜`
                resultado.style.color = "purple";
                return;
            }
            if (num % 3 === 0) {
                resultado.innerHTML = `O número <strong>${num}</strong> é múltiplo de 3 💚`
                resultado.style.color = "green";
            } else {
                if (num % 5 === 0) {
                    resultado.innerHTML = `O número <strong> ${num}</strong> é múltiplo de 5 💙`
                    resultado.style.color = "blue";
                } else {
                    resultado.innerHTML = `O número <strong> ${num}</strong> não é múltiplo de 3 ou 5 🖤`
                    resultado.style.color = "gray";
                }
            }
        }
    </script>
</body>
</html>

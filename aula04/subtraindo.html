<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subtraindo Valores</title>
    <style>
        body {
            background-color: rgb(238, 174, 174);
            font: normal 20pt Arial;
            text-align: center;
            color: white;
        }
        input {
            font: normal 20pt Arial;
            width: 100px;
            color: rgb(128, 97, 102)
        }
    </style>
</head>
<body>
    <h1>Subtraindo Valores</h1>
    <input type="number" name="txtn1" id="txtn1"> -
    <input type="number" name="txtn2" id="txtn2">
    <input type="button" value="Subtrair", onclick="subtrair()">
    <div id="res"><strong>Resultado</strong></div>

    <script>
        function subtrair() {
            var tn1 = document.getElementById('txtn1')
            var tn2 = document.getElementById('txtn2')
            var res = document.getElementById('res')
            var n1 = Number(tn1.value)
            var n2 = Number(tn2.value)
            var s = n1 - n2
            res.innerHTML = `A subtração entre os valores ${n1} e ${n2} é igual a ${s}.`
        }
    </script>
</body>
</html>
